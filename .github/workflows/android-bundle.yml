name: Build Android app bundle

on:
  push:
    branches:
      - codex/android-aab
    paths:
      - 'android/**'
      - 'public/**'
      - '.github/workflows/android-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build and lint release
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease :app:lintRelease
      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: watchmaker-android-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 3
